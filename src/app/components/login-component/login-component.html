<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <section class="card border-0 shadow-sm w-100" style="max-width: 28rem;">
    <div class="card-body p-4 p-md-5">
      <span class="badge text-bg-primary mb-3">Empleados</span>
      <h1 class="h2 mb-2">Iniciar sesión</h1>
      <p class="text-body-secondary mb-4">Introduce tus credenciales para continuar.</p>

      <form #formlogin="ngForm">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" type="text" name="cajausuario" #cajausuario class="form-control"/>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" name="cajapassword" #cajapassword class="form-control"/>
        </div>
        <button type="button" class="btn btn-primary w-100" (click)="login()">Iniciar sesión</button>
      </form>
    </div>
  </section>
</main>
